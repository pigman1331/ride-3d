<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>騎行 3D 路線動畫</title>
<meta name="description" content="把 Bryton / Garmin 的 FIT 或 GPX 騎行紀錄做成 3D 地形路線動畫">
<style>body{margin:0;font-size:14px}</style>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<style>
/* Layout: one-screen player — stage (map + HUD canvas) fills the screen, control dock pinned below */
:root{
  --ink:#0d1117; --panel:#161c24; --line:#2a3340; --text:#e8edf2; --muted:#8a96a6;
  --amber:#ffb547; --cyan:#57d3e6; --danger:#ff5d5d;
  --f-num:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--ink);color:var(--text);font-family:var(--f-body);overflow:hidden}
#app{height:100%;display:grid;grid-template-rows:1fr auto;grid-template-columns:minmax(0,1fr)}
#stage{position:relative;min-height:0;display:grid;place-items:center;overflow:hidden;background:#05070a}
#frame{position:relative;width:100%;height:100%;overflow:hidden}
#map,#hud{position:absolute;inset:0}
#hud{pointer-events:none;width:100%;height:100%}
#scrubzone{position:absolute;left:0;right:0;bottom:0;height:22%;cursor:ew-resize;touch-action:none}
.maplibregl-ctrl-attrib{font-size:10px;background:rgba(0,0,0,.45)!important}
.maplibregl-ctrl-attrib a{color:#cfd6de!important}
#loading{position:absolute;inset:0;display:grid;place-items:center;background:var(--ink);z-index:5;font-size:15px;color:var(--muted);transition:opacity .5s}
#loading b{display:block;font-family:var(--f-num);font-size:40px;letter-spacing:.04em;color:var(--text);margin-bottom:6px;font-weight:600}
#loading.gone{opacity:0;pointer-events:none}
#dock{background:var(--panel);border-top:1px solid var(--line);
  padding-block:10px calc(10px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.grp{display:flex;align-items:center;gap:8px;min-width:0;flex-wrap:wrap}
.grow{flex:1 1 260px}
button,select,input[type=text]{font:inherit;font-size:13px;color:var(--text);background:#1f2731;border:1px solid var(--line);border-radius:6px;height:34px;padding:0 12px}
button{cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
button:hover{border-color:#4a5768}
button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid var(--amber);outline-offset:1px}
#play{width:44px;padding:0;justify-content:center;background:var(--amber);color:#1a1205;border-color:var(--amber)}
#play svg{width:16px;height:16px}
#rec{border-color:#5a2a2a}
#rec .dot{width:9px;height:9px;border-radius:50%;background:var(--danger)}
#rec.on{background:var(--danger);color:#fff;border-color:var(--danger)}
#rec.on .dot{background:#fff}
input[type=range]{flex:1;min-width:80px;accent-color:var(--amber)}
#tlabel{font-family:var(--f-num);font-size:16px;font-variant-numeric:tabular-nums;color:var(--muted);min-width:86px;text-align:right}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;border-radius:0;height:32px;background:transparent;color:var(--muted)}
.seg button[aria-pressed=true]{background:#2b3542;color:var(--text)}
label.sm{font-size:12px;color:var(--muted)}
#title{width:150px}
#durhint{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:84px}
#ccolor{width:38px;height:34px;padding:2px;border:1px solid var(--line);border-radius:6px;background:#1f2731;cursor:pointer}
#toast{position:absolute;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:rgba(13,17,23,.92);border:1px solid var(--line);padding:8px 14px;border-radius:8px;font-size:13px;z-index:6;max-width:min(90%,520px);text-align:center}
#drop{position:absolute;inset:0;z-index:7;display:grid;place-items:center;background:rgba(13,17,23,.82);border:2px dashed var(--amber);font-size:18px}
@media (max-width:640px){#title{width:110px}.hide-sm{display:none}}
@media (prefers-reduced-motion:reduce){#loading{transition:none}}
</style>

</head>
<body>
<div id="app">
  <div id="stage">
    <div id="frame">
      <div id="map"></div>
      <canvas id="hud"></canvas>
      <div id="scrubzone" title="拖曳調整播放位置"></div>
    </div>
    <div id="loading"><div style="text-align:center"><b>載入地形中</b><span id="loadmsg">衛星影像與騎行紀錄準備中…</span></div></div>
    <div id="toast" hidden></div>
    <div id="drop" hidden>放開以載入 FIT / GPX 檔</div>
  </div>
  <div id="dock">
    <div class="grp grow">
      <button id="play" aria-label="播放"><svg viewBox="0 0 16 16"><path id="playicon" d="M4 2l10 6-10 6z" fill="currentColor"/></svg></button>
      <input type="range" id="scrub" min="0" max="1000" value="0" step="1" aria-label="播放位置">
      <span id="tlabel">0:00</span>
    </div>
    <div class="grp">
      <div class="seg" role="group" aria-label="兩段紀錄的接法">
        <button id="m-seam" aria-pressed="true">無縫接續</button>
        <button id="m-split" aria-pressed="false">分段標示</button>
      </div>
    </div>
    <div class="grp">
      <label class="sm" for="dur">長度</label>
      <select id="dur">
        <optgroup label="固定長度"><option value="30">30 秒</option><option value="45">45 秒</option><option value="60" selected>60 秒</option><option value="90">90 秒</option><option value="120">2 分鐘</option></optgroup>
        <optgroup label="播放倍速"><option value="x1">1×（實際速度）</option><option value="x2">2×</option><option value="x5">5×</option><option value="x10">10×</option><option value="x20">20×</option><option value="x50">50×</option><option value="x100">100×</option></optgroup>
      </select>
      <span class="sm" id="durhint"></span>
      <label class="sm" for="aspect">比例</label>
      <select id="aspect"><option value="fill">填滿</option><option value="16:9">16:9</option><option value="9:16">9:16 直式</option><option value="1:1">1:1</option></select>
    </div>
    <div class="grp">
      <label class="sm" for="cmode">路線</label>
      <select id="cmode"><option value="solid">單色</option><option value="speed">依速度</option><option value="power">依功率</option></select>
      <input type="color" id="ccolor" value="#ffb547" aria-label="路線顏色">
    </div>
    <div class="grp">
      <label class="sm" for="hudmode">面板</label>
      <select id="hudmode"><option value="std">標準</option><option value="cockpit">座艙・變速</option></select>
    </div>
    <div class="grp">
      <label class="sm hide-sm" for="title">標題</label>
      <input type="text" id="title" value="晨騎・內湖山區" maxlength="24">
    </div>
    <div class="grp">
      <label class="sm" for="recmode">影片</label>
      <select id="recmode" aria-label="錄製方式"><option value="rt" selected>即時錄製</option><option value="frame">逐格輸出（手機）</option></select>
      <select id="quality" aria-label="影片畫質"><option value="1280">720p</option><option value="1920" selected>1080p</option></select>
      <button id="rec"><span class="dot"></span><span id="rectext">錄成影片</span></button>
      <button id="open">換檔案</button>
      <input type="file" id="file" accept=".fit,.gpx" multiple hidden>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4-muxer@5.1.3/build/mp4-muxer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script>
// Minimal FIT reader: returns record messages as [unix, lat, lon, alt, distM, kmh, hr, cad, pwr, temp]
function parseFIT(buf){
  const dv=new DataView(buf);const hs=dv.getUint8(0);const dataSize=dv.getUint32(4,true);
  const sig=String.fromCharCode(dv.getUint8(8),dv.getUint8(9),dv.getUint8(10),dv.getUint8(11));
  if(sig!=='.FIT')throw new Error('不是有效的 FIT 檔');
  let p=hs;const end=Math.min(hs+dataSize,buf.byteLength);const defs={};let lastTs=0;const out=[];const gears=[];
  const S=180/2147483648, EPOCH=631065600;
  function rd(off,size,bt,le){
    const t=bt&0x1F;
    if(size===1){const v=dv.getUint8(off);if(t===1){return v===0x7F?null:(v>127?v-256:v)}return v===0xFF?null:v}
    if(size===2){if(t===3){const v=dv.getInt16(off,le);return v===0x7FFF?null:v}const v=dv.getUint16(off,le);return v===0xFFFF?null:v}
    if(size===4){if(t===5){const v=dv.getInt32(off,le);return v===0x7FFFFFFF?null:v}const v=dv.getUint32(off,le);return v===0xFFFFFFFF?null:v}
    return null;
  }
  while(p<end){
    const h=dv.getUint8(p++);let local,tsOff=null;
    if(h&0x80){local=(h>>5)&3;tsOff=h&0x1F}
    else if(h&0x40){
      local=h&0xF;const dev=h&0x20;p++;const le=dv.getUint8(p++)===0;const g=le?dv.getUint16(p,true):dv.getUint16(p,false);p+=2;
      const n=dv.getUint8(p++);const fields=[];let len=0;
      for(let i=0;i<n;i++){fields.push([dv.getUint8(p),dv.getUint8(p+1),dv.getUint8(p+2)]);len+=dv.getUint8(p+1);p+=3}
      if(dev){const nd=dv.getUint8(p++);for(let i=0;i<nd;i++){len+=dv.getUint8(p+1);p+=3}}
      defs[local]={g,le,fields,len};continue;
    } else local=h&0xF;
    const d=defs[local];if(!d)throw new Error('FIT 格式錯誤');
    if(d.g===20){
      const f={};let o=p;
      for(const [num,size,bt] of d.fields){f[num]=rd(o,size,bt,d.le);o+=size}
      let ts=f[253];
      if(ts!=null)lastTs=ts;
      else if(tsOff!=null){ts=(lastTs&~0x1F)+tsOff;if(tsOff<(lastTs&0x1F))ts+=0x20;lastTs=ts}
      if(f[0]!=null&&f[1]!=null&&ts){
        const alt=f[78]!=null?f[78]/5-500:(f[2]!=null?f[2]/5-500:null);
        const spd=f[73]!=null?f[73]/1000:(f[6]!=null?f[6]/1000:null);
        out.push([ts+EPOCH,f[0]*S,f[1]*S,alt,f[5]!=null?f[5]/100:null,spd!=null?spd*3.6:null,f[3]||0,f[4]||0,f[7]||0,f[13]==null?null:f[13]]);
      }
    } else if(d.g===21){ // event: Di2 / eTap gear changes
      const f={};let o=p;for(const [num,size,bt] of d.fields){f[num]=rd(o,size,bt,d.le);o+=size}
      let ts=f[253];if(ts!=null)lastTs=ts;else if(tsOff!=null){ts=(lastTs&~0x1F)+tsOff;if(tsOff<(lastTs&0x1F))ts+=0x20;lastTs=ts}
      const ev=f[0],g=f[3];
      if((ev===42||ev===43||ev===44)&&g!=null&&ts)gears.push([ts+EPOCH,(g>>>16)&255,(g>>>24)&255,g&255,(g>>>8)&255]);
    } else if(tsOff!=null){lastTs=(lastTs&~0x1F)+tsOff}
    p+=d.len;
  }
  out.gears=gears;return out;
}



/* ---------------- ride model ---------------- */
const R=6371000,rad=Math.PI/180;
function hav(a,b,c,d){const x=Math.sin((c-a)*rad/2)**2+Math.cos(a*rad)*Math.cos(c*rad)*Math.sin((d-b)*rad/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function bearing(a,b,c,d){const y=Math.sin((d-b)*rad)*Math.cos(c*rad),x=Math.cos(a*rad)*Math.sin(c*rad)-Math.sin(a*rad)*Math.cos(c*rad)*Math.cos((d-b)*rad);return Math.atan2(y,x)/rad}
function parseGPX(text){
  const doc=new DOMParser().parseFromString(text,'application/xml');const pts=[...doc.getElementsByTagName('trkpt')];
  const v=(el,tag)=>{const n=el.getElementsByTagNameNS('*',tag)[0];return n?parseFloat(n.textContent):null};
  return pts.map(p=>{const t=p.getElementsByTagName('time')[0];return [t?Date.parse(t.textContent)/1000:0,+p.getAttribute('lat'),+p.getAttribute('lon'),v(p,'ele'),null,null,v(p,'hr')||0,v(p,'cad')||0,v(p,'power')||0,v(p,'atemp')]}).filter(r=>r[0]);
}
// rows: [unix, lat, lon, alt, distM, kmh, hr, cad, pwr, temp]
function cleanSegment(rows){
  rows.sort((a,b)=>a[0]-b[0]);let d=0;
  for(let i=0;i<rows.length;i++){
    const r=rows[i];if(i){const p=rows[i-1];const dd=hav(p[1],p[2],r[1],r[2]);if(r[4]==null)r[4]=d+dd;d=r[4]||d+dd;
      if(r[5]==null){const dt=Math.max(1,r[0]-p[0]);r[5]=dd/dt*3.6}}else{if(r[4]==null)r[4]=0;if(r[5]==null)r[5]=0}
    if(r[3]==null)r[3]=i?rows[i-1][3]:0;
  }
  return rows;
}
let RIDE=null;
function buildRide(segs){
  segs=segs.filter(s=>s.length>1).sort((a,b)=>a[0][0]-b[0][0]);
  const GE=[];segs.forEach(r=>(r.gears||[]).forEach(g=>GE.push(g)));GE.sort((a,b)=>a[0]-b[0]);
  const rearT={},frontT={};GE.forEach(g=>{frontT[g[1]]=g[2];rearT[g[3]]=g[4]});
  const P=[];let a=0,dOff=0;const segInfo=[];
  segs.forEach((rows,si)=>{
    const start=P.length;
    // smooth speed a little (5 pts)
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      if(i){const dt=r[0]-rows[i-1][0];a+=Math.min(Math.max(dt,0),5)}
      let s=0,n=0;for(let k=-2;k<=2;k++){const q=rows[i+k];if(q){s+=q[5];n++}}
      P.push({t:r[0],lat:r[1],lng:r[2],alt:r[3],d:(r[4]+dOff)/1000,v:s/n,hr:r[6],cad:r[7],pw:r[8],tmp:r[9],seg:si,a});
    }
    dOff+=rows[rows.length-1][4];
    segInfo.push({i0:start,i1:P.length-1,a0:P[start].a,a1:P[P.length-1].a,t0:rows[0][0],t1:rows[rows.length-1][0]});
    a+=1;
  });
  let up=0,ref=P[0].alt,maxAlt=-1e9,maxV=0,hrS=0,hrN=0,moving=0;
  for(let i=0;i<P.length;i++){const p=P[i];
    if(p.alt>ref+3){up+=p.alt-ref;ref=p.alt}else if(p.alt<ref-3)ref=p.alt;
    maxAlt=Math.max(maxAlt,p.alt);maxV=Math.max(maxV,p.v);if(p.hr){hrS+=p.hr;hrN++}}
  segInfo.forEach(s=>moving+=s.t1-s.t0);
  let minLat=90,maxLat=-90,minLng=180,maxLng=-180;
  for(const p of P){minLat=Math.min(minLat,p.lat);maxLat=Math.max(maxLat,p.lat);minLng=Math.min(minLng,p.lng);maxLng=Math.max(maxLng,p.lng)}
  const altMin=Math.min(...P.map(p=>p.alt));
  // smoothed values for route coloring (speed ±5 pts, power ±15 pts, within a segment)
  for(let i=0;i<P.length;i++){let sv=0,nv=0,sp=0,np=0;
    for(let k=-15;k<=15;k++){const q=P[i+k];if(!q||q.seg!==P[i].seg)continue;sp+=q.pw;np++;if(k>=-5&&k<=5){sv+=q.v;nv++}}
    P[i].cv=sv/nv;P[i].cp=sp/np;let s3=0,n3=0;for(let k=-1;k<=1;k++){const q=P[i+k];if(q&&q.seg===P[i].seg){s3+=q.pw;n3++}}P[i].p3=s3/n3}
  const pct=(arr,q)=>{const s=[...arr].sort((x,y)=>x-y);return s[Math.min(s.length-1,Math.floor(q*s.length))]};
  const rng={speed:[pct(P.map(p=>p.cv),.05),pct(P.map(p=>p.cv),.95)],power:[pct(P.map(p=>p.cp),.05),pct(P.map(p=>p.cp),.95)]};
  return {P,segs:segInfo,A:P[P.length-1].a,dist:P[P.length-1].d,up,maxAlt,altMin,maxV,avgHr:hrN?hrS/hrN:0,moving,
    bounds:[[minLng,minLat],[maxLng,maxLat]],hasHr:hrN>0,hasPw:P.some(p=>p.pw>0),hasCad:P.some(p=>p.cad>0),rng,gears:GE,hasGears:GE.length>0,rearT,frontT,nRear:Math.max(0,...Object.keys(rearT).map(Number))};
}
function sampleAt(a){
  const P=RIDE.P;let lo=0,hi=P.length-1;
  if(a<=P[0].a)return{...P[0],k:0};if(a>=P[hi].a)return{...P[hi],k:hi};
  while(hi-lo>1){const m=(lo+hi)>>1;if(P[m].a<=a)lo=m;else hi=m}
  const p=P[lo],q=P[hi];if(p.seg!==q.seg)return{...p,k:lo};
  const f=(a-p.a)/((q.a-p.a)||1),L=(x,y)=>x+(y-x)*f;
  return{...p,lat:L(p.lat,q.lat),lng:L(p.lng,q.lng),alt:L(p.alt,q.alt),d:L(p.d,q.d),v:L(p.v,q.v),hr:Math.round(L(p.hr,q.hr)),pw:Math.round(L(p.pw,q.pw)),cad:Math.round(L(p.cad,q.cad)),t:L(p.t,q.t),k:lo,f};
}

/* ---------------- timeline ---------------- */
const INTRO=4.5,OUTRO=6,PAUSE=2.6;
const state={speedX:0,hud:'std',gearShow:null,cmode:'solid',color:'#ffb547',dur:60,mode:'seam',T:0,playing:false,last:0,bearing:0,rec:null,title:''};
function pauses(){return state.mode==='split'?RIDE.segs.slice(0,-1).map(s=>s.a1):[]}
function total(){return INTRO+state.dur+pauses().length*PAUSE+OUTRO}
// map timeline T -> {phase, a, pauseIdx}
function phaseAt(T){
  if(T<INTRO)return{phase:'intro',u:T/INTRO,a:0};
  let t=T-INTRO;const sc=RIDE.A/state.dur;let a=0;const ps=pauses();
  for(let i=0;i<ps.length;i++){
    const need=(ps[i]-a)/sc;
    if(t<need)return{phase:'ride',a:a+t*sc};
    t-=need;a=ps[i];
    if(t<PAUSE)return{phase:'pause',a,pi:i,u:t/PAUSE};
    t-=PAUSE;a=RIDE.segs[i+1].a0;
  }
  const need=(RIDE.A-a)/sc;
  if(t<need)return{phase:'ride',a:a+t*sc};
  t-=need;return{phase:'outro',a:RIDE.A,u:Math.min(1,t/OUTRO)};
}

/* ---------------- map ---------------- */
const map=new maplibregl.Map({
  container:'map',preserveDrawingBuffer:true,attributionControl:false,maxPitch:80,minZoom:3,
  style:{version:8,
    sources:{
      sat:{type:'raster',tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],tileSize:256,maxzoom:18},
      dem:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:14,encoding:'terrarium'},
      dem2:{type:'raster-dem',tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png'],tileSize:256,maxzoom:14,encoding:'terrarium'}
    },
    sky:{'sky-color':'#24406b','horizon-color':'#f2c99a','fog-color':'#d9b48e','sky-horizon-blend':.55,'horizon-fog-blend':.7,'fog-ground-blend':.35,'atmosphere-blend':['interpolate',['linear'],['zoom'],0,1,12,.6,15,.3]},
    layers:[{id:'bg',type:'background',paint:{'background-color':'#1d2630'}},
      {id:'sat',type:'raster',source:'sat',paint:{'raster-saturation':-.08,'raster-contrast':.06}},
      {id:'shade',type:'hillshade',source:'dem2',paint:{'hillshade-exaggeration':.25,'hillshade-shadow-color':'#0b1420','hillshade-highlight-color':'#fff3e0','hillshade-illumination-direction':300}}],
    terrain:{source:'dem',exaggeration:1.35}
  },
  center:[121.577,25.11],zoom:12.5,pitch:50
});


function lineFeature(pts,seg){return{type:'Feature',properties:{seg},geometry:{type:'LineString',coordinates:pts}}}
function routeFC(){
  const fs=RIDE.segs.map((s,i)=>lineFeature(RIDE.P.slice(s.i0,s.i1+1).map(p=>[p.lng,p.lat]),i));
  if(state.mode==='seam'&&RIDE.segs.length>1){ // bridge the gap in seamless mode

const RAMP=[[0,'#3b6fd8'],[.25,'#2fbf9a'],[.5,'#e8e04a'],[.75,'#ff9a3c'],[1,'#ff3d55']];

/* ---------------- camera ---------------- */
let overview=null;
function computeOverview(){
  const c=map.cameraForBounds(RIDE.bounds,{padding:{top:60,bottom:map.getContainer().clientHeight*.28,left:40,right:40}});
  overview={center:[c.center.lng,c.center.lat],zoom:(c.zoom||12.5)-.25,pitch:48};
}
const ease=u=>u<.5?4*u*u*u:1-Math.pow(-2*u+2,3)/2;

  const sc=RIDE.A/state.dur;const p=sampleAt(a),q=sampleAt(Math.min(RIDE.A,a+Math.max(60,sc*1.1)));
  const r=sampleAt(Math.max(0,a-20));

}
function rideZoom(){const h=map.getContainer().clientHeight,w=map.getContainer().clientWidth;return 14.35+Math.log2(Math.min(w,h)/700)*.6}
function rideCam(p,b){return{center:[p.lng,p.lat],zoom:rideZoom(),pitch:64,bearing:b}}
function applyCam(c){
  const h=map.getContainer().clientHeight;
  map.jumpTo({center:c.center,zoom:c.zoom,pitch:c.pitch,bearing:c.bearing,padding:{top:h*c.padTop||0,bottom:0,left:0,right:0}});
}

let cur=null,ph=null;
function update(dt,snap){
  ph=phaseAt(state.T);cur=sampleAt(ph.a);
  const tb=targetBearing(ph.a);
  if(snap||ph.phase==='intro')state.bearing=tb;
  else if(ph.phase==='ride'){const k=1-Math.exp(-dt/0.9);state.bearing=angLerp(state.bearing,tb,k)}
  let cam;
  if(ph.phase==='intro'){
    const ov={...overview,bearing:tb-35+ph.u*15,padTop:0};
    const st={...rideCam(cur,tb),padTop:.32};
    const u=Math.max(0,(ph.u-.3)/.7);cam=lerpCam(ov,st,ease(u));
    if(ph.u<.3)cam=ov;
  }else if(ph.phase==='outro'){
    const st={...rideCam(cur,state.bearing),padTop:.32};
    const ov={...overview,bearing:state.bearing+40,padTop:0};
    cam=lerpCam(st,ov,ease(Math.min(1,ph.u*1.4)));
  }else cam={...rideCam(cur,state.bearing),padTop:.32};
  applyCam(cam);
  map.getSource('done').setData(doneFC(ph.phase==='intro'?{...cur,k:-1}:cur));
}

/* ---------------- cockpit HUD: Di2 gear position + speed / cadence / 3s power ---------------- */
function gearIdx(t){const G=RIDE.gears;let lo=0,hi=G.length-1;if(t<G[0][0])return 0;while(lo<hi){const m=(lo+hi+1)>>1;if(G[m][0]<=t)lo=m;else hi=m-1}return lo}
// the gear held longest inside a short window, so time-compressed playback doesn't flicker
function gearAt(t){
  const G=RIDE.gears,w=Math.max(0,RIDE.A/state.dur*.3);
  if(w<3)return G[gearIdx(t)];
  const a=t-w/2,b=t+w/2;let i=gearIdx(a);const acc={};let best=null,bv=-1;
  for(;i<G.length&&G[i][0]<b;i++){const s0=Math.max(a,G[i][0]),s1=Math.min(b,i+1<G.length?G[i+1][0]:b);
    const k=G[i][1]*100+G[i][3];acc[k]=(acc[k]||0)+Math.max(0,s1-s0);if(acc[k]>bv){bv=acc[k];best=G[i]}}
  return best||G[gearIdx(t)];
}
const AMBER='#ff9f2e';
/* ---------------- number zones: banded colors for speed / heart rate / power ---------------- */
const ZONES={speed:[5,10,15,20,25,30,35,40,45,50,55,60],hr:[100,120,130,140,150,160,170,180,190],power:[100,130,160,180,200,220,250,300,350,400,450,500,600,700]};
const ZPAL=['#3d7bff','#2fc6ff','#2fe0b0','#5be06a','#c8e64a','#ffd23f','#ffa12e','#ff6a2e','#ff2d2d'];
function palAt(u){const x=u*(ZPAL.length-1),i=Math.min(ZPAL.length-2,Math.floor(x)),f=x-i;
  const h=c=>[1,3,5].map(o=>parseInt(c.slice(o,o+2),16)),a=h(ZPAL[i]),b=h(ZPAL[i+1]);
  return '#'+a.map((v,k)=>Math.round(v+(b[k]-v)*f).toString(16).padStart(2,'0')).join('')}
const ZCOL={};for(const k in ZONES){const n=ZONES[k].length;ZCOL[k]=Array.from({length:n+1},(_,i)=>palAt(i/n))}

  for(let i=0;i<n;i++){hg.fillStyle=i<on?col:'rgba(255,255,255,.12)';hg.fillRect(x+i*(sw+gap),y,sw,h)}}
function readout(x,y,label,val,unit,size,col,bar,s,fb,bw){
  hg.textAlign='left';hg.font=`500 ${11.5*s}px ${fb}`;hg.fillStyle='rgba(232,237,242,.66)';hg.fillText(label,x,y-size*s-8*s);
  hg.font=`600 ${size*s}px ${FN}`;hg.fillStyle=col;const vs=String(val);hg.fillText(vs,x,y);const vw=hg.measureText(vs).width;
  hg.font=`500 ${14*s}px ${FN}`;hg.fillStyle='rgba(232,237,242,.7)';hg.fillText(unit,x+vw+4*s,y);

  }
  // gear ratio
  hg.textAlign='right';hg.font=`700 ${34*s}px ${FN}`;hg.fillStyle='#fff';

// shared remux: fragmented MP4 (MediaRecorder) -> regular faststart MP4
function remuxMp4(buf){
  return new Promise((resolve,reject)=>{
    const f=MP4Box.createFile();let info=null;const samples=[];
    f.onError=e=>reject(new Error(e));
    f.onReady=i=>{info=i;const tr=i.videoTracks[0];if(!tr)return reject(new Error('沒有影像軌'));
      f.setExtractionOptions(tr.id,null,{nbSamples:1e9});f.start()};
    f.onSamples=(id,u,s)=>{for(const x of s)samples.push(x)};
    buf.fileStart=0;f.appendBuffer(buf);f.flush();
    setTimeout(()=>{try{
      if(!info||!samples.length)throw new Error('讀不到影格');
      const tr=info.videoTracks[0],trak=f.getTrackById(tr.id);
      const entry=trak.mdia.minf.stbl.stsd.entries[0];const box=entry.avcC||entry.hvcC;
      const DS=(window.MP4Box&&MP4Box.DataStream)||window.DataStream;const ds=new DS(undefined,0,DS.BIG_ENDIAN);box.write(ds);
      const description=new Uint8Array(ds.buffer,8);
      const w=tr.video?tr.video.width:tr.track_width,h=tr.video?tr.video.height:tr.track_height;
      const target=new Mp4Muxer.ArrayBufferTarget();
      const mux=new Mp4Muxer.Muxer({target,video:{codec:'avc',width:w,height:h},fastStart:'in-memory',firstTimestampBehavior:'offset'});
      samples.sort((a,b)=>a.dts-b.dts);
      samples.forEach((s,k)=>{
        const ts=Math.round(s.cts/s.timescale*1e6),du=Math.max(1,Math.round(s.duration/s.timescale*1e6));
        mux.addVideoChunkRaw(s.data,s.is_sync?'key':'delta',ts,du,k===0?{decoderConfig:{codec:tr.codec,codedWidth:w,codedHeight:h,description}}:undefined);
      });
      mux.finalize();resolve(target.buffer);
    }catch(e){reject(e)}},0);
  });
}

(async()=>{

  const segs=(await (await fetch('rides.json')).json()).map(o=>cleanSegment(Array.isArray(o)?o:Object.assign(o.rows,{gears:o.gears})));
  await new Promise(r=>map.loaded()?r():map.on('load',r));
  RIDE=buildRide(segs);applyDur(document.getElementById('dur').value);addRouteLayers();syncColorUI();computeOverview();layout();update(0,true);syncUI();
  document.getElementById('loadmsg').textContent='準備完成';
  const done=()=>{if(done.x)return;done.x=1;document.getElementById('loading').classList.add('gone');setTimeout(()=>{if(!state.T)setPlaying(true)},500)};
  map.once('idle',done);setTimeout(done,12000);
})();
</script>
